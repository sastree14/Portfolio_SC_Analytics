name: portfolio-quality

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Audit structure, principal code, links and visuals
        run: python scripts/audit_portfolio.py
