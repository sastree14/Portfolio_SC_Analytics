services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: scanalytics
      POSTGRES_PASSWORD: scanalytics
    volumes:
      - agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanalytics -d agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agent_redis:/data

  api:
    build:
      context: ../..
      dockerfile: technical/infra/Dockerfile
    env_file: ../../.env
    environment:
      TASK_BACKEND: celery
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: technical/infra/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    env_file: ../../.env
    environment:
      TASK_BACKEND: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  agent_postgres:
  agent_redis:
